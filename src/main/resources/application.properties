spring.application.name=kafka_demo
server.port=18080

spring.kafka.bootstrap-servers=localhost:9092
#this is the default group-id if any consumer do not mention group-id while annotating @KafkaListener(annotated group-id overrides default one)
#spring.kafka.consumer.group-id=email-group
spring.kafka.consumer.auto-offset-reset=earliest

# Key is always a String
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Value is your event object
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Trusted packages(can be added multiple separated by comma/* for all - this is done to prevent deserialization gadget attack)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kafkademo.dto
# Preventing class name into message header
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=com.kafkademo.dto.OrderPlacedEvent

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO